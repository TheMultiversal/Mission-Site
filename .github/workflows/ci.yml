name: CI

on:
  push:
    branches: [ main, master, 'work/**', 'add/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run markdown lint
        run: npx markdownlint '**/*.md' || true

      - name: Check markdown links
        run: npx markdown-link-check --config .markdown-link-check.json "$(git ls-files '*.md' | tr '\n' ' ')" || true

      - name: Spellcheck (cspell)
        run: npx cspell "**/*.md" || true

      - name: NPM Audit (security)
        run: npm audit --audit-level=moderate || true

      - name: List changed files
        run: git status --porcelain
